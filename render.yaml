services:
  - type: web
    name: mts-load-distribution-tabs
    runtime: node
    plan: free
    rootDir: app
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /
    autoDeployTrigger: commit
    envVars:
      - key: NODE_ENV
        value: production
      - key: HOST
        value: 0.0.0.0
      - key: TABS_API_TOKEN
        sync: false
      - key: TABS_DIRECTORIES_DATASHEET_ID
        value: dstUTQd5tp5sCU7mLv
      - key: TABS_DIRECTORIES_VIEW_ID
        value: viwV8x7vx4jzL
      - key: TABS_YUC_SETTINGS_DATASHEET_ID
        value: dstGXdrV1Mb3Rkc57E
      - key: TABS_YUC_SETTINGS_VIEW_ID
        value: viwzMFn8hWD2U
      - key: TABS_REGIONAL_ASSIGNMENTS_DATASHEET_ID
        value: dstPFbxwoPH7YfCRAz
      - key: TABS_REGIONAL_ASSIGNMENTS_VIEW_ID
        value: viwrYdxBbj4UD
      - key: TABS_REGIONAL_SUBSTITUTIONS_DATASHEET_ID
        value: dstZng9NVviKd5PhnZ
      - key: TABS_REGIONAL_SUBSTITUTIONS_VIEW_ID
        value: viwMkyAsobxjs
      - key: TABS_REQUEST_TIMEOUT_MS
        value: "30000"
      - key: TABS_REQUEST_RETRIES
        value: "3"
