services:
  - type: web
    name: mts-load-distribution-tabs
    runtime: node
    plan: free
    rootDir: app
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /
    autoDeployTrigger: commit
    envVars:
      - key: NODE_ENV
        value: production
      - key: HOST
        value: 0.0.0.0
      - key: TABS_API_TOKEN
        sync: false
      - key: TABS_DIRECTORIES_DATASHEET_ID
        value: dstUTQd5tp5sCU7mLv
      - key: TABS_DIRECTORIES_VIEW_ID
        value: viwV8x7vx4jzL
      - key: TABS_REQUEST_TIMEOUT_MS
        value: "30000"
      - key: TABS_REQUEST_RETRIES
        value: "3"
