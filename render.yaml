services:
  - type: web
    name: mts-load-distribution
    runtime: node
    plan: free
    buildCommand: cd app && npm ci
    startCommand: cd app && npm start
    healthCheckPath: /api/health
    autoDeployTrigger: commit
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: RENDER
        value: "true"
      - key: FILE_LOGGING
        value: "false"
      # Для внешнего соединения Render с MTS Tabs используем меньшие ответы.
      - key: TABS_PAGE_SIZE
        value: "250"
      - key: TABS_REQUEST_TIMEOUT_MS
        value: "45000"
      - key: TABS_REQUEST_RETRIES
        value: "3"
      - key: TABS_API_TOKEN
        sync: false
      - key: TABS_LOAD_COEFFICIENTS_DATASHEET_ID
        value: dstMwyNHdQBXtX4hzP
      - key: TABS_LOAD_COEFFICIENTS_VIEW_ID
        value: viwj6WawdPEJM
      - key: AUTH_SESSION_SECRET
        generateValue: true
      - key: BOOTSTRAP_ADMIN_LOGIN
        sync: false
      - key: BOOTSTRAP_ADMIN_CODE
        sync: false
