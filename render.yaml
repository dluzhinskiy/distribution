services:
  - type: web
    name: mts-load-distribution
    runtime: node
    plan: free
    buildCommand: cd app && npm ci
    startCommand: cd app && npm start
    healthCheckPath: /api/health
    autoDeployTrigger: commit
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: RENDER
        value: "true"
      - key: FILE_LOGGING
        value: "false"
      - key: TABS_API_TOKEN
        sync: false
      - key: AUTH_SESSION_SECRET
        generateValue: true
      - key: BOOTSTRAP_ADMIN_LOGIN
        sync: false
      - key: BOOTSTRAP_ADMIN_CODE
        sync: false
